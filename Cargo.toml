[package]
name = "sscl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Secure Shell Command Line — a terminal that opens and remembers SSH connections"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/exiledddev/sshterm"
keywords = ["ssh", "terminal", "gui", "egui"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
portable-pty = "0.9.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
vt100 = "0.16"
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
