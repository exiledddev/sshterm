[package]
name = "acli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Amplified Command Line Interface — a splitting terminal with a glass UI"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/exiledddev/sshterm"
keywords = ["terminal", "tty", "gui", "egui", "splits"]
categories = ["command-line-utilities"]

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
portable-pty = "0.9.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16"
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
